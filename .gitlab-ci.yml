stages:
  - sync
  - dns
  - deploy

default:
  image: node:20-bookworm

sync-vercel:
  stage: sync
  before_script:
    - npm ci
  script:
    - npm run validate
    - node scripts/sync-vercel.js
  rules:
    - if: $CI_PIPELINE_SOURCE == "trigger"
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - config.yaml
        - "projects/**"
      when: on_success
    - when: manual

deploy-docs:
  stage: deploy
  before_script:
    - npm ci
  script:
    - npm run validate
    - |
      if [ -z "$DOCS_SHA" ]; then
        eval "$(node scripts/get-latest-docs-ref-sha.js)"
      fi
    - node scripts/deploy-docs.js
  rules:
    - if: $CI_PIPELINE_SOURCE == "trigger" && $DOCS_SHA != null && $DOCS_SHA != ""
      when: always
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - config.yaml
        - "projects/**"
      when: on_success
    - when: manual

dns:cloudflare:
  stage: dns
  script:
    - npm ci
    - npm run dns
  rules:
    - if: $CI_PIPELINE_SOURCE == "trigger"
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - config.yaml
        - "projects/**"
      when: on_success
    - when: manual
