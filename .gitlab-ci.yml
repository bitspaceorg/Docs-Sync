stages:
  - sync
  - dns
  - deploy
  - cron

default:
  image: node:20-bookworm

sync-vercel:
  stage: sync
  before_script:
    - npm ci
  script:
    - npm run validate
    - node scripts/sync-vercel.js
  rules:
    - if: $CI_PIPELINE_SOURCE == "trigger"
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - config.yaml
        - "projects/**"
      when: on_success
    - when: manual

deploy-docs:
  stage: deploy
  before_script:
    - npm ci
  script:
    - npm run validate
    - |
      if [ -z "$DOCS_SHA" ]; then
        eval "$(node scripts/get-latest-docs-ref-sha.js)"
      fi
    - node scripts/deploy-docs.js
  rules:
    - if: $CI_PIPELINE_SOURCE == "trigger" && $DOCS_SHA != null && $DOCS_SHA != ""
      when: always
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - config.yaml
        - "projects/**"
      when: on_success
    - when: manual

dns:cloudflare:
  stage: dns
  script:
    - npm ci
    - npm run dns
  rules:
    - if: $CI_PIPELINE_SOURCE == "trigger"
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - config.yaml
        - "projects/**"
      when: on_success
    - when: manual

# Run every minute: CI/CD → Schedules → New schedule → Cron: * * * * *
cron:check-data:
  stage: cron
  cache:
    key: cron-timestamps
    paths:
      - .cache/
  before_script:
    - npm ci
  script:
    - node scripts/cron-check-data.js
  artifacts:
    paths:
      - .cache/
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: on_success
    - when: never

# GitLab Pages: last-rebuilt status (when schedule ran) or repo public/.
pages:
  stage: .post
  before_script:
    - npm ci
  script:
    - |
      if [ -f .cache/cron-last-deployed.json ]; then
        node scripts/generate-cron-status-html.js
      fi
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "schedule"
