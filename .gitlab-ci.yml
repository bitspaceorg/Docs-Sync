stages:
  - sync
  - dns
  - deploy

default:
  image: node:20-bookworm

sync-vercel:
  stage: sync
  before_script:
    - npm ci
  script:
    - npm run validate
    - node scripts/sync-vercel.js
  variables:
    DOCS_VERCEL_TOKEN: $DOCS_VERCEL_TOKEN
    DOCS_VERCEL_API_TOKEN: $DOCS_VERCEL_API_TOKEN
    DOCS_VERCEL_TEAM_ID: $DOCS_VERCEL_TEAM_ID
    VERCEL_TOKEN: $VERCEL_TOKEN
    VERCEL_TEAM_ID: $VERCEL_TEAM_ID
  rules:
    - if: $CI_PIPELINE_SOURCE == "trigger"
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - config.yaml
        - "projects/**"
      when: on_success
    - when: manual

deploy-docs:
  stage: deploy
  before_script:
    - npm ci
  script:
    - npm run validate
    - |
      if [ -z "$DOCS_SHA" ]; then
        eval "$(node scripts/get-latest-docs-ref-sha.js)"
      fi
    - node scripts/deploy-docs.js
  variables:
    DOCS_VERCEL_TOKEN: $DOCS_VERCEL_TOKEN
    DOCS_VERCEL_API_TOKEN: $DOCS_VERCEL_API_TOKEN
    DOCS_VERCEL_TEAM_ID: $DOCS_VERCEL_TEAM_ID
    VERCEL_TOKEN: $VERCEL_TOKEN
    VERCEL_TEAM_ID: $VERCEL_TEAM_ID
    DOCS_REF: $DOCS_REF
    DOCS_SHA: $DOCS_SHA
  rules:
    - if: $CI_PIPELINE_SOURCE == "trigger" && $DOCS_SHA != null && $DOCS_SHA != ""
      when: always
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - config.yaml
        - "projects/**"
      when: on_success
    - when: manual

dns:cloudflare:
  stage: dns
  script:
    - npm ci
    - npm run dns
  variables:
    DOCS_CLOUDFLARE_API_TOKEN: $DOCS_CLOUDFLARE_API_TOKEN
    CLOUDFLARE_API_TOKEN: $CLOUDFLARE_API_TOKEN
  rules:
    - if: $CI_PIPELINE_SOURCE == "trigger"
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - config.yaml
        - "projects/**"
      when: on_success
    - when: manual
